# /docker-compose.yml

services:
  # --- 后端服务 ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./backend/api:/app/api
      - ./backend/etl:/app/etl
      - ./backend/main.py:/app/main.py
      - ./backend/db:/app/db
      - ./backend/core:/app/core
      - ./backend/requirements.txt:/app/requirements.txt
    ports:
      - "8000:8000"
    networks:
      - jarvis_net
    env_file:
      - ./backend/.env
    environment:
      - UVICORN_DEFAULT_LOG_LEVEL=info
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.py' --reload-exclude '__pycache__/*' --reload-exclude '*.pyc' --log-level info
networks:
  jarvis_net:
    driver: bridge
