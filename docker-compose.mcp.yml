services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: jarvis-mcp-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8081
      - JARVIS_API_BASE_URL=${JARVIS_API_BASE_URL:-http://jarvis-backend:8000/admin}
      - JARVIS_STATIC_AUTH_TOKEN=${JARVIS_STATIC_AUTH_TOKEN:-}
      - JARVIS_MCP_API_KEY=${JARVIS_MCP_API_KEY:?set JARVIS_MCP_API_KEY before starting mcp-server}
      - JARVIS_REQUEST_TIMEOUT=${JARVIS_REQUEST_TIMEOUT:-20}
    networks:
      - jarvis_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  jarvis_net:
    external: true
    name: jarvis_jarvis_net
